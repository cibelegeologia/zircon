name: Mac Intel (compatível)

# Separado dos outros instaladores: se a máquina Intel do GitHub não ficar
# disponível, só esta montagem espera na fila.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: pip install --prefer-binary -r requirements-compat.txt "pyinstaller==5.13.2"
      - run: python -m pip install pytest && python -m pytest -q testes/unitarios
      - run: |
          # a última parte do registro aparece como aviso na página da montagem
          pyinstaller --noconfirm --distpath dist --workpath build instalador/zircon.spec > montagem.log 2>&1 \
            || { echo "::warning::$(tail -30 montagem.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
      - run: sh instalador/macos_dmg.sh "$(python -c 'import zircon; print(zircon.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: Zircon-macos-intel
          path: dist/Zircon-*.dmg
      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Zircon-*.dmg
          # etiqueta com hífen (ex.: v0.6.0-teste) sai como pré-lançamento
          prerelease: ${{ contains(github.ref_name, '-') }}
