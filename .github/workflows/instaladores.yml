name: Instaladores

# Windows e Linux usam a montagem compatível (Python 3.8 + Qt 5), que roda
# em sistemas de 2010 para cá. O Mac tem duas: Intel compatível (macOS 10.13+,
# também roda em chip Apple) e chip Apple moderna (macOS 14+).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            requisitos: requirements.txt
          - python: "3.8"
            requisitos: requirements-compat.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --prefer-binary -r ${{ matrix.requisitos }} pytest
      - run: python -m pytest -q testes/unitarios

  windows:
    needs: testes
    runs-on: windows-latest
    strategy:
      matrix:
        arquitetura: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arquitetura }}
      - run: pip install --prefer-binary -r requirements-compat.txt "pyinstaller==5.13.2"
      - run: pyinstaller --noconfirm --distpath dist --workpath build instalador/zircon.spec
      - name: Instalar Inno Setup 6.2 (o instalador roda no Windows 7)
        run: choco install innosetup --version 6.2.2 --no-progress -y --allow-downgrade
      - name: Montar instalador
        shell: pwsh
        env:
          ARQ: ${{ matrix.arquitetura }}
        run: |
          $versao = (python -c "import zircon; print(zircon.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersao=$versao" "/DArq=$env:ARQ" instalador\zircon.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Zircon-windows-${{ matrix.arquitetura }}
          path: dist/Zircon-*-instalador*.exe

  linux:
    needs: testes
    runs-on: ubuntu-latest
    container: python:3.8-slim-buster
    steps:
      - name: Ferramentas de montagem
        run: |
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g; /buster-updates/d' /etc/apt/sources.list
          apt-get update && apt-get install -y --no-install-recommends binutils dpkg git libglib2.0-0 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-util0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - uses: actions/checkout@v4
      - run: pip install --prefer-binary -r requirements-compat.txt "pyinstaller==5.13.2"
      - run: pyinstaller --noconfirm --distpath dist --workpath build instalador/zircon.spec
      - name: Incluir bibliotecas do X11 que o Qt 5 precisa (Pop!_OS, Ubuntu 22.04+)
        run: sh instalador/linux_bibliotecas.sh
      - name: Abrir o programa numa tela virtual (confere se ele inicia)
        run: |
          # bibliotecas que qualquer área de trabalho Linux já tem; o contêiner de montagem não
          apt-get install -y --no-install-recommends xvfb xauth libx11-6 libx11-xcb1 libxcb1 libxrender1 \
            libxi6 libsm6 libice6 libxext6 libegl1 libfreetype6 libxkbcommon0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxcb-render0 fonts-dejavu-core
          D=dist/Zircon
          LD_LIBRARY_PATH=$D:$D/PySide2/Qt/lib ldd $D/PySide2/Qt/plugins/platforms/libqxcb.so | grep "not found" | sed 's/^/::warning::falta /' || true
          # diagnóstico visível como aviso na página da montagem
          timeout 60 xvfb-run -a sh -c "$D/Zircon --teste-inicio" > inicio.log 2>&1 || true
          tail -15 inicio.log | sed 's/^/::warning::/'
          timeout 60 xvfb-run -a sh -c "$D/Zircon --teste-inicio"
      - run: sh instalador/linux_deb.sh "$(python -c 'import zircon; print(zircon.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: Zircon-linux
          path: |
            dist/Zircon-*.deb
            dist/Zircon-*.tar.gz

  macos-chip-apple:
    needs: testes
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build instalador/zircon.spec
      - run: sh instalador/macos_dmg.sh "$(python -c 'import zircon; print(zircon.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: Zircon-macos-chip-apple
          path: dist/Zircon-*.dmg

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos-chip-apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
